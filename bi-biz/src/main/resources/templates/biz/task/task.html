<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('检测任务列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <input type="hidden" name="projectId" th:value="${projectId}"/>
                <div class="select-list">
                    <ul>
                        <li>
                            <label>项目名称：</label>
                            <input type="text" name="project.name"/>
                        </li>
                        <li>
                            <label>桥梁名称：</label>
                            <input type="text" name="building.name"/>
                        </li>
                        <li>
                            <label>项目编号：</label>
                            <input type="text" name="project.code"/>
                        </li>

                        <li>
                            <label>项目年限：</label>
                            <input type="text"
                                   name="project.year"
                                   placeholder="请输入4位年份(如:2025)"
                                   pattern="\d{4}"
                                   maxlength="4"
                                   oninput="this.value=this.value.replace(/[^0-9]/g,'');"/>
                        </li>
                        <li>
                            <label>状态：</label>
                            <select name="status" th:with="type=${@dict.getType('bi_task_status')}">
                                <option value="">所有</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>业务状态：</label>
                            <select name="type">
                                <option value="">所有</option>
                                <option value="1">已提交</option>
                                <option value="0">未提交</option>
                            </select>
                        </li>
                        <li class="select-time">
                            <label>更新日期： </label>
                            <input type="text" class="time-input" id="startTime" placeholder="开始日期" name="updateStartDate"/>
                            <span>-</span>
                            <input type="text" class="time-input" id="endTime" placeholder="结束日期" name="updateEndDate"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>

                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="biz:task:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="biz:task:export">
                <i class="fa fa-download"></i> 导出
            </a>
            <a class="btn btn-success multiple disabled" onclick="batchExportDisease()" shiro:hasPermission="biz:disease:export"
               style="display:none">
                <i class="fa fa-download"></i> 批量导出病害
            </a>
            <a id="batch-export-disease-excel-btn" class="btn btn-info multiple disabled" onclick="batchExportDiseaseExcel()" shiro:hasPermission="biz:disease:export">
                <i class="fa fa-file-excel-o"></i> 批量导出病害Excel
            </a>
            <a id="sort-by-name" class="btn btn-default task-sort-button" onclick="toggleTaskSort('buildingName')"
               title="再次点击可切换升序/降序">
                <i class="fa fa-sort"></i> 按名称降序/升序
            </a>
            <a id="sort-by-time" class="btn btn-primary task-sort-button" onclick="toggleTaskSort('updateTime')"
               title="再次点击可切换升序/降序">
                <i class="fa fa-sort-amount-desc"></i> 按时间升序/降序
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('biz:task:edit')}]];
    var evaluateFlag = [[${@permission.hasPermi('biz:evaluation:calculate')}]];
    var evaluateDetailFlag = [[${@permission.hasPermi('biz:evaluation:detail')}]];
    var statusDatas = [[${@dict.getType('bi_task_status')}]];
    var areaDatas = [[${@dict.getType('bi_building_area')}]];
    var lineDatas = [[${@dict.getType('bi_buildeing_line')}]];
    var taskTypeDatas = [[${@dict.getType('bi_task_type')}]];
    var select = [[${select}]]
    var projectId = [[${projectId}]];
    var prefix = ctx + "biz/task";
    var evaluationPrefix = ctx + "biz/bievaluation";
    var taskSheetPrefix = ctx + "biz/taskSheet";
    var batchDiseaseExcelExportState = {
        status: "idle",
        taskIds: "",
        blob: null,
        fileName: "任务病害数据.xlsx",
        xhr: null
    };

    $(function () {
        // 若存在项目ID，则隐藏项目相关的查询条件
        if (projectId !== null && projectId !== undefined && projectId !== '' && projectId !== 'null' && projectId !== 'undefined') {
            $('#formId input[name="project.name"]').closest('li').hide();
            $('#formId input[name="project.code"]').closest('li').hide();
            $('#formId input[name="project.year"]').closest('li').hide();
            $('#formId .select-time').hide();
        }

        var options = {
            url: prefix + "/list/" + select,
            updateUrl: prefix + "/edit/{id}",
            exportUrl: prefix + "/export",
            modalName: "检测任务",
            sortName: "updateTime",
            sortOrder: "desc",

            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: '任务ID',
                    visible: false
                },
                {
                    field: 'project.name',
                    title: '项目名称'
                },
                {
                    field: 'building.name',
                    title: '桥梁名称',
                    formatter: function(value, row, index) {
                        return '<a href="javascript:void(0)" onclick="openBuildingList(\'' + value + '\')">' + value + '</a>';
                    }
                },
                {
                    field: 'building.area',
                    title: '片区',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(areaDatas, value);
                    }
                },
                {
                    field: 'building.line',
                    title: '线路',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(lineDatas, value);
                    }
                },
                {
                    field: 'status',
                    title: '状态',
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(statusDatas, value);
                    }
                },
                {
                    field: 'type',
                    title: '类型',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(taskTypeDatas, value);
                    }
                },
                {
                    field: 'evaluationResult',
                    title: '评定等级'
                },
                {
                    field: 'updateBy',
                    title: '更新用户',
                    visible: false
                },
                {
                    field: 'updateTime',
                    title: '更新时间',
                    formatter: function(value) {
                        return value ? $.common.dateFormat(value, 'yyyy-MM-dd HH:mm:ss') : '-';
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="inspect(\'' + row.id + '\')"><i class="fa fa-search"></i>检查</a> ');
                        actions.push('<a class="btn btn-warning btn-xs ' + evaluateFlag + '" href="javascript:void(0)" onclick="doEvaluate(\'' + row.id + '\', \'' + row.building.rootObjectId + '\', \'' + row.building.name + '\')"><i class="fa fa-calculator"></i>评定</a> ');
                        actions.push('<a class="btn btn-primary btn-xs ' + evaluateDetailFlag + '" href="javascript:void(0)" onclick="viewEvaluateDetail(\'' + row.id + '\', \'' + row.building.name + '\')"><i class="fa fa-list-alt"></i>评定详情</a> ');
                        actions.push('<a class="btn btn-default btn-xs" href="javascript:void(0)" onclick="openTaskSheets(\'' + row.id + '\', \'' + (row.building.name || '').replace(/'/g, "\\'") + '\')"><i class="fa fa-table"></i>检测记录</a> ');
                        return actions.join('');
                    }
                }]
        };

        $.table.init(options);
        updateTaskSortButtons(options.sortName, options.sortOrder);
    });

    function toggleTaskSort(sortName) {
        var options = $('#bootstrap-table').bootstrapTable('getOptions');
        var sortOrder;

        if (options.sortName === sortName) {
            sortOrder = options.sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
            sortOrder = sortName === 'buildingName' ? 'asc' : 'desc';
        }

        sortTasks(sortName, sortOrder);
    }

    function sortTasks(sortName, sortOrder) {
        $.table.refreshOptions({
            sortName: sortName,
            sortOrder: sortOrder,
            pageNumber: 1
        });
        updateTaskSortButtons(sortName, sortOrder);
    }

    function updateTaskSortButtons(sortName, sortOrder) {
        $('.task-sort-button').removeClass('btn-primary').addClass('btn-default');
        $('#sort-by-name').html('<i class="fa fa-sort"></i> 按名称降序/升序');
        $('#sort-by-time').html('<i class="fa fa-sort"></i> 按时间升序/降序');

        var directionIcon = sortOrder === 'asc' ? 'asc' : 'desc';
        if (sortName === 'buildingName') {
            $('#sort-by-name')
                .removeClass('btn-default').addClass('btn-primary')
                .html('<i class="fa fa-sort-alpha-' + directionIcon + '"></i> 按名称降序/升序');
        } else {
            $('#sort-by-time')
                .removeClass('btn-default').addClass('btn-primary')
                .html('<i class="fa fa-sort-amount-' + directionIcon + '"></i> 按时间升序/降序');
        }
    }

    function inspect(taskId) {
        var url = prefix + "/inspect/" + taskId;
        $.modal.openTab("任务检查", url);
    }

    function doEvaluate(taskId, rootObjectId, buildingName) {
        // 先检查根节点对象的状态
        $.ajax({
            type: "GET",
            url: ctx + "biz/biobject/getStatus/" + rootObjectId,
            success: function(result) {
                if (result.code == 0) {
                    var status = result.data;
                    if (status == "3") {
                        // 状态为3，继续原来的评定流程
                        performEvaluation(taskId, rootObjectId, buildingName);
                    } else {
                        // 状态不是3，先执行修正权重和锁定操作，统一显示"正在计算评定结果"
                        var loadingIndex = $.modal.loading("正在计算评定结果，请稍候...");

                        // 第一步：修正权重
                        $.ajax({
                            type: "POST",
                            url: ctx + "biz/biobject/correctWeights",
                            data: {
                                "rootObjectId": rootObjectId
                            },
                            success: function(correctResult) {
                                if (correctResult.code == 0) {
                                    // 第二步：锁定对象（设置状态为3）
                                    $.ajax({
                                        type: "POST",
                                        url: ctx + "biz/biobject/edit",
                                        data: {
                                            "id": rootObjectId,
                                            "status": "3"
                                        },
                                        success: function(lockResult) {
                                            if (lockResult.code == 0) {
                                                // 第三步：继续原来的评定流程
                                                $.ajax({
                                                    type: "GET",
                                                    url: evaluationPrefix + "/calculate/" + taskId + "/" + rootObjectId,
                                                    success: function(result) {
                                                        $.modal.closeLoading(loadingIndex);
                                                        if (result.code == 0) {
                                                            var url = evaluationPrefix + "/detail/" + taskId + "?buildingName=" + encodeURIComponent(buildingName);
                                                            $.modal.openTab("技术状况评定", url);
                                                        } else {
                                                            $.modal.alertError(result.msg);
                                                        }
                                                    },
                                                    error: function() {
                                                        $.modal.closeLoading(loadingIndex);
                                                        $.modal.alertError("系统错误");
                                                    }
                                                });
                                            } else {
                                                $.modal.closeLoading(loadingIndex);
                                                $.modal.alertError("锁定失败：" + lockResult.msg);
                                            }
                                        },
                                        error: function() {
                                            $.modal.closeLoading(loadingIndex);
                                            $.modal.alertError("锁定失败，请稍后重试");
                                        }
                                    });
                                } else {
                                    $.modal.closeLoading(loadingIndex);
                                    $.modal.alertError("修正权重失败：" + correctResult.msg);
                                }
                            },
                            error: function() {
                                $.modal.closeLoading(loadingIndex);
                                $.modal.alertError("修正权重失败，请稍后重试");
                            }
                        });
                    }
                } else {
                    $.modal.alertError(result.msg || "获取对象状态失败");
                }
            },
            error: function() {
                $.modal.alertError("获取对象状态失败");
            }
        });
    }

    // 执行评定流程
    function performEvaluation(taskId, rootObjectId, buildingName) {
        $.modal.loading("正在计算评定结果，请稍候...");
        $.ajax({
            type: "GET",
            url: evaluationPrefix + "/calculate/" + taskId + "/" + rootObjectId,
            success: function(result) {
                $.modal.closeLoading();
                if (result.code == 0) {
                    var url = evaluationPrefix + "/detail/" + taskId + "?buildingName=" + encodeURIComponent(buildingName);
                    $.modal.openTab("技术状况评定", url);
                } else {
                    $.modal.alertError(result.msg);
                }
            },
            error: function() {
                $.modal.closeLoading();
                $.modal.alertError("系统错误");
            }
        });
    }

    function viewEvaluateDetail(taskId, buildingName) {
        $.ajax({
            type: "GET",
            url: evaluationPrefix + "/check/" + taskId,
            success: function(result) {
                if (result.code == 0 && result.data) {
                    var url = evaluationPrefix + "/detail/" + taskId + "?buildingName=" + encodeURIComponent(buildingName);
                    $.modal.openTab("评定详情", url);
                } else {
                    $.modal.alertWarning("此桥梁尚无技术状况评定");
                }
            }
        });
    }

    function openBuildingList(buildingName) {
        // 通过URL参数传递桥梁名称
        var url = ctx + "biz/building?name=" + encodeURIComponent(buildingName);
        $.modal.openTab("桥梁建筑管理", url);
    }

    /**
     * 打开任务表格数据列表（弹窗）
     */
    function openTaskSheets(taskId, buildingName) {
        var url = taskSheetPrefix + "/sheets/" + taskId;
        if (buildingName) {
            url += "?buildingName=" + encodeURIComponent(buildingName);
        }
        var title = buildingName ? ("检测记录 - " + buildingName) : "检测记录";
        top.layer.open({
            type: 2,
            title: title,
            content: url,
            area: ['960px', '580px'],
            fix: false,
            maxmin: true,
            shade: 0.3,
            shadeClose: true,
            btn: ['关闭'],
            btnAlign: 'r',
            yes: function (index) { top.layer.close(index); }
        });
    }
    
    /**
     * 批量导出病害数据
     */
    function batchExportDisease() {
        console.log("开始批量导出病害数据");
        var rows = $.table.selectColumns("id");
        console.log("选中的任务ID:", rows);
        
        if (rows.length == 0) {
            $.modal.alertWarning("请至少选择一个任务");
            return;
        }
        
        $.modal.confirm("确认要导出选中的" + rows.length + "个任务的病害数据吗？", function() {
            $.modal.loading("正在导出数据，请稍候...");
            
            // 直接使用window.location进行下载，避免表单提交问题
            var url = ctx + "biz/task/batchExport?taskIds=" + rows.join(",");
            console.log("导出URL:", url);
            
            // 使用iframe下载文件，避免页面跳转
            var downloadFrame = $('<iframe style="display:none;"></iframe>');
            downloadFrame.attr('src', url);
            $(document.body).append(downloadFrame);
            
            // 30秒后移除iframe并关闭加载提示
            setTimeout(function() {
                downloadFrame.remove();
                $.modal.closeLoading();
            }, 30000);
        });
    }

    function resetBatchDiseaseExcelButton() {
        var $button = $('#batch-export-disease-excel-btn');
        $button.html('<i class="fa fa-file-excel-o"></i> 批量导出病害Excel');
        $button.removeAttr('aria-disabled').removeData('export-state');
        $button.toggleClass('disabled', $.table.selectColumns("id").length === 0);
    }

    function setBatchDiseaseExcelButtonProcessing() {
        var $button = $('#batch-export-disease-excel-btn');
        $button.addClass('disabled')
            .attr('aria-disabled', 'true')
            .data('export-state', 'processing')
            .html('<i class="fa fa-spinner fa-spin"></i> 正在导出，请稍候...');
    }

    function getBatchDiseaseExcelFileName(xhr) {
        var disposition = xhr.getResponseHeader('Content-Disposition') || '';
        var encodedName = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (encodedName && encodedName[1]) {
            return decodeURIComponent(encodedName[1].trim());
        }

        var normalName = disposition.match(/filename="?([^";]+)"?/i);
        if (normalName && normalName[1]) {
            return decodeURIComponent(normalName[1].trim().replace(/\+/g, '%20'));
        }
        return '任务病害数据.xlsx';
    }

    function readBatchDiseaseExcelError(xhr, fallbackMessage) {
        var response = xhr.response;
        if (!(response instanceof Blob)) {
            finishBatchDiseaseExcelExport(false, fallbackMessage);
            return;
        }

        var reader = new FileReader();
        reader.onload = function () {
            var message = fallbackMessage;
            try {
                var result = JSON.parse(reader.result);
                message = result.msg || result.message || message;
            } catch (e) {
                if (reader.result) {
                    message = reader.result;
                }
            }
            finishBatchDiseaseExcelExport(false, message);
        };
        reader.onerror = function () {
            finishBatchDiseaseExcelExport(false, fallbackMessage);
        };
        reader.readAsText(response, 'UTF-8');
    }

    function finishBatchDiseaseExcelExport(success, message) {
        $.modal.closeLoading();
        batchDiseaseExcelExportState.xhr = null;

        if (success) {
            batchDiseaseExcelExportState.status = 'completed';
            // 请求完整结束后再关闭加载提示，并自动触发浏览器下载。
            downloadBatchDiseaseExcel();
            $.modal.msgSuccess('Excel已自动开始下载');
            return;
        }

        batchDiseaseExcelExportState.status = 'idle';
        batchDiseaseExcelExportState.taskIds = '';
        batchDiseaseExcelExportState.blob = null;
        resetBatchDiseaseExcelButton();
        $.modal.alertError(message || '病害Excel导出失败，请稍后重试');
    }

    function downloadBatchDiseaseExcel() {
        if (batchDiseaseExcelExportState.status !== 'completed' || !batchDiseaseExcelExportState.blob) {
            return;
        }

        var objectUrl = window.URL.createObjectURL(batchDiseaseExcelExportState.blob);
        var downloadLink = document.createElement('a');
        downloadLink.href = objectUrl;
        downloadLink.download = batchDiseaseExcelExportState.fileName || '任务病害数据.xlsx';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        window.setTimeout(function () {
            window.URL.revokeObjectURL(objectUrl);
        }, 1000);

        batchDiseaseExcelExportState.status = 'idle';
        batchDiseaseExcelExportState.taskIds = '';
        batchDiseaseExcelExportState.blob = null;
        resetBatchDiseaseExcelButton();
    }

    function startBatchDiseaseExcelExport(taskIds) {
        if (batchDiseaseExcelExportState.status === 'processing') {
            $.modal.alertWarning('病害Excel正在导出，请勿重复点击');
            return;
        }

        var xhr = new XMLHttpRequest();
        var url = ctx + "biz/task/batchExportExcel";

        batchDiseaseExcelExportState.status = 'processing';
        batchDiseaseExcelExportState.taskIds = taskIds;
        batchDiseaseExcelExportState.blob = null;
        batchDiseaseExcelExportState.xhr = xhr;
        setBatchDiseaseExcelButtonProcessing();
        $.modal.loading("正在导出病害Excel，请稍候...");

        // 用 POST 传 taskIds，避免多选很多桥时 GET 查询串被截断丢任务
        xhr.open('POST', url, true);
        xhr.timeout = 0;
        xhr.responseType = 'blob';
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        xhr.onload = function () {
            var contentType = xhr.getResponseHeader('Content-Type') || '';
            var isExcel = contentType.indexOf('spreadsheetml') >= 0
                || contentType.indexOf('application/octet-stream') >= 0;
            if (xhr.status >= 200 && xhr.status < 300 && isExcel && xhr.response && xhr.response.size > 0) {
                batchDiseaseExcelExportState.blob = xhr.response;
                batchDiseaseExcelExportState.fileName = getBatchDiseaseExcelFileName(xhr);
                finishBatchDiseaseExcelExport(true);
            } else {
                readBatchDiseaseExcelError(xhr, '服务器未返回有效的Excel文件');
            }
        };
        xhr.onerror = function () {
            finishBatchDiseaseExcelExport(false, '网络异常，病害Excel导出失败');
        };
        xhr.ontimeout = function () {
            finishBatchDiseaseExcelExport(false, '病害Excel导出请求超时，请稍后重试');
        };
        xhr.onabort = function () {
            finishBatchDiseaseExcelExport(false, '病害Excel导出已取消');
        };
        xhr.send('taskIds=' + encodeURIComponent(taskIds));
    }

    /**
     * 批量导出病害Excel，照片编号在Excel中作为图片URL超链接。
     */
    function batchExportDiseaseExcel() {
        console.log("开始批量导出病害Excel");
        var rows = $.table.selectColumns("id");
        console.log("选中的任务ID:", rows);

        if (batchDiseaseExcelExportState.status === 'processing') {
            $.modal.alertWarning('病害Excel正在导出，请勿重复点击');
            return;
        }

        if (rows.length == 0) {
            $.modal.alertWarning("请至少选择一个任务");
            return;
        }

        $.modal.confirm("确认要导出选中的" + rows.length + "个任务的病害Excel吗？", function() {
            startBatchDiseaseExcelExport(rows.join(","));
        });
    }

</script>
</body>
</html>
